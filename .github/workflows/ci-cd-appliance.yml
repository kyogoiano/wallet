name: Appliance CI/CD & GHCR Delivery

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7.0.1

      - name: Set up Java 27
        uses: actions/setup-java@v6.0.1
        with:
          distribution: 'temurin'
          java-version: '27'
          check-latest: true

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Execute Tests
        run: ./gradlew test

  publish-oci:
    name: Publish OCI Images to GHCR
    needs: [ build-and-test ]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.4.1

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Metadata (Edge)
        id: meta-edge
        uses: docker/metadata-action@v6.2.0
        with:
          images: ghcr.io/${{ github.repository }}/wallet-edge
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=short
            type=ref,event=branch
            type=ref,event=tag

      - name: Build & Push Edge Image
        uses: docker/build-push-action@v7.4.0
        with:
          context: .
          file: dockerfile
          target: edge
          push: true
          tags: ${{ steps.meta-edge.outputs.tags }}
          labels: ${{ steps.meta-edge.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Extract Metadata (Core)
        id: meta-core
        uses: docker/metadata-action@v6.2.0
        with:
          images: ghcr.io/${{ github.repository }}/wallet-core
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=short
            type=ref,event=branch
            type=ref,event=tag

      - name: Build & Push Core Image
        uses: docker/build-push-action@v7.4.0
        with:
          context: .
          file: dockerfile
          target: core
          push: true
          tags: ${{ steps.meta-core.outputs.tags }}
          labels: ${{ steps.meta-core.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Install Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.14.0

      - name: Package and Push Helm Chart to GHCR OCI
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io -u ${{ github.actor }} --password-stdin
          mkdir -p .helm-packages
          helm package deploy/helm/wallet-platform -d .helm-packages
          helm push .helm-packages/wallet-platform-*.tgz oci://ghcr.io/${{ github.repository }}/charts

  redeploy-appliance:
    name: Portainer GitOps Auto-Deploy
    needs: [ publish-oci ]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Portainer Webhook
        env:
          PORTAINER_WEBHOOK_URL: ${{ secrets.PORTAINER_WEBHOOK_URL }}
        run: |
          if [ -n "$PORTAINER_WEBHOOK_URL" ]; then
            echo "▶ Triggering Portainer appliance stack auto-redeploy webhook..."
            curl -s -S -X POST -f "$PORTAINER_WEBHOOK_URL" || {
              echo "⚠️ Portainer webhook call completed or returned non-200. Check appliance status."
            }
            echo "✅ Portainer webhook dispatched."
          else
            echo "ℹ️  PORTAINER_WEBHOOK_URL secret is not configured; skipping automated redeployment."
            echo "   To enable, generate a webhook in Portainer Stack settings and add it to GitHub Secrets."
          fi
