plugins {
	id 'java'
	id 'org.springframework.boot' version '4.0.6'
	id 'io.spring.dependency-management' version '1.1.7'
}

group = 'br.com.wallet'
version = '0.0.1-SNAPSHOT'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(25)
	}
}

repositories {
	mavenCentral()
}


ext {
	springVersion = "7.0.6"
	openApiVersion = "3.0.3"
	jnatsVersion = "2.25.3"
	lettuceVersion = "7.5.2.RELEASE"
	otlpAppenderVersion = "2.21.0-alpha"
	caffeineVersion = "3.2.4"
	nettyVersion = "4.2.13.Final"
	resilience4jVersion = "2.4.0"
}

subprojects {
	apply plugin: 'java'
	apply plugin: 'io.spring.dependency-management'

	version = '0.0.1-SNAPSHOT'

	dependencyManagement {
		imports {
			mavenBom "org.springframework.boot:spring-boot-dependencies:4.0.6"
		}
	}

	java {
		toolchain {
			languageVersion = JavaLanguageVersion.of(25)
		}
	}

	repositories {
		mavenCentral()
	}

	bootJar {
		enabled = false
	}

	jar {
		enabled = true
	}

	dependencies {
		implementation 'org.springframework.boot:spring-boot-starter'
	}
}

bootJar {
	enabled = true
}

dependencies {
	// Project dependencies
	implementation project(':core')
	implementation project(':fraud')

	// Spring Boot Starters for the main application
	implementation 'org.springframework.boot:spring-boot-starter'
	implementation 'org.springframework.boot:spring-boot-starter-opentelemetry'
	implementation("io.opentelemetry.instrumentation:opentelemetry-logback-appender-1.0:${otlpAppenderVersion}")
	implementation 'org.springframework.boot:spring-boot-starter-jackson'
	implementation 'org.springframework.boot:spring-boot-starter-jdbc'
	implementation 'org.springframework.boot:spring-boot-starter-web'
	implementation 'org.springframework.boot:spring-boot-starter-validation'
	implementation 'org.springframework.boot:spring-boot-starter-actuator'
	
	// Other dependencies
	implementation 'org.springframework:spring-aspects'
	implementation("org.springdoc:springdoc-openapi-starter-webmvc-ui:${openApiVersion}")
	implementation("io.nats:jnats:${jnatsVersion}")
	implementation("io.lettuce:lettuce-core:${lettuceVersion}")
	implementation("io.netty:netty-transport-native-epoll")
	implementation("io.netty:netty-transport-native-epoll:${nettyVersion}:linux-x86_64")

	// Test dependencies
	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

	testImplementation 'org.springframework.boot:spring-boot-testcontainers'
	testImplementation 'org.testcontainers:testcontainers-junit-jupiter'
	testImplementation 'org.testcontainers:testcontainers-postgresql'

	runtimeOnly 'org.postgresql:postgresql'
}

tasks.named('test') {
	useJUnitPlatform()
}
