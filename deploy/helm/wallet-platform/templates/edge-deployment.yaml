apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "wallet-platform.fullname" . }}-edge
  labels:
    {{- include "wallet-platform.labels" . | nindent 4 }}
    {{- include "wallet-platform.edgeSelectorLabels" . | nindent 4 }}
spec:
  replicas: {{ .Values.edge.replicaCount }}
  selector:
    matchLabels:
      {{- include "wallet-platform.edgeSelectorLabels" . | nindent 6 }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        {{- include "wallet-platform.edgeSelectorLabels" . | nindent 8 }}
    spec:
      terminationGracePeriodSeconds: {{ .Values.edge.terminationGracePeriodSeconds | default 30 }}
      securityContext:
        {{- toYaml .Values.edge.podSecurityContext | nindent 8 }}
      containers:
        - name: edge
          image: "{{ .Values.edge.image.repository }}:{{ .Values.edge.image.tag }}"
          imagePullPolicy: {{ .Values.edge.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.edge.securityContext | nindent 12 }}
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
            - name: quic
              containerPort: 8443
              protocol: UDP
          env:
            - name: SERVER_PORT
              value: "8080"
            - name: WALLET_RUNTIME_MODE
              value: "multi-process"
            - name: WALLET_EDGE_ENABLED
              value: "true"
            - name: NATS_URL
              value: {{ .Values.nats.url | quote }}
            - name: EDGE_SPOOL_DIR
              value: {{ .Values.edge.persistence.mountPath | quote }}
            - name: JAVA_TOOL_OPTIONS
              value: "-XX:MaxRAMPercentage=75 -Duser.timezone=UTC"
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 3
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 3
          resources:
            {{- toYaml .Values.edge.resources | nindent 12 }}
          volumeMounts:
            - name: spool-volume
              mountPath: {{ .Values.edge.persistence.mountPath }}
      volumes:
        - name: spool-volume
          persistentVolumeClaim:
            claimName: {{ include "wallet-platform.fullname" . }}-edge-spool
