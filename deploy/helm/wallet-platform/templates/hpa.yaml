{{- if .Values.edge.hpa.enabled }}
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ include "wallet-platform.fullname" . }}-edge-hpa
  labels:
    {{- include "wallet-platform.labels" . | nindent 4 }}
    {{- include "wallet-platform.edgeSelectorLabels" . | nindent 4 }}
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ include "wallet-platform.fullname" . }}-edge
  minReplicas: {{ .Values.edge.hpa.minReplicas }}
  maxReplicas: {{ .Values.edge.hpa.maxReplicas }}
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: {{ .Values.edge.hpa.targetCPUUtilizationPercentage }}
{{- end }}
---
{{- if .Values.core.hpa.enabled }}
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ include "wallet-platform.fullname" . }}-core-hpa
  labels:
    {{- include "wallet-platform.labels" . | nindent 4 }}
    {{- include "wallet-platform.coreSelectorLabels" . | nindent 4 }}
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ include "wallet-platform.fullname" . }}-core
  minReplicas: {{ .Values.core.hpa.minReplicas }}
  maxReplicas: {{ .Values.core.hpa.maxReplicas }}
  metrics:
    - type: External
      external:
        metric:
          name: nats_jetstream_consumer_num_pending
        target:
          type: Value
          averageValue: {{ .Values.core.hpa.targetConsumerLag }}
{{- end }}
