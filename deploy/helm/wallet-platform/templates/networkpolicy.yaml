{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "wallet-platform.fullname" . }}-core-isolation
  labels:
    {{- include "wallet-platform.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "wallet-platform.coreSelectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
  ingress:
    # Allow management scraping from Edge or internal prometheus pods only
    - from:
        - podSelector:
            matchLabels:
              {{- include "wallet-platform.edgeSelectorLabels" . | nindent 14 }}
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
      ports:
        - protocol: TCP
          port: 8081
{{- end }}
