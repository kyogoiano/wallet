

group = 'br.com.wallet.fraud'
ext {
    resilience4jVersion = "2.4.0"
    onnxRuntimeVersion = "1.30.0"
}

dependencies {
    implementation project(":core") // Fraud module depends on core for tracing, etc.
    implementation 'org.springframework.modulith:spring-modulith-starter-core'
    implementation 'org.springframework.boot:spring-boot-starter-jdbc'
    implementation 'org.jspecify:jspecify'

    implementation("io.lettuce:lettuce-core:${rootProject.ext.lettuceVersion}")
    implementation("com.github.ben-manes.caffeine:caffeine:${rootProject.ext.caffeineVersion}")
    implementation("io.github.resilience4j:resilience4j-spring-boot4:${resilience4jVersion}")
    implementation("com.microsoft.onnxruntime:onnxruntime:${onnxRuntimeVersion}")
    implementation 'org.springframework:spring-web'
    implementation 'tools.jackson.core:jackson-core'
    implementation 'tools.jackson.core:jackson-databind'
    // Spring Boot Test dependencies for fraud module
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

test {
    useJUnitPlatform()
    jvmArgs '-XX:+EnableDynamicAgentLoading', '-Dnet.bytebuddy.experimental=true'
}
