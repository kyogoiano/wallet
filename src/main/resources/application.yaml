spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/wallet
    username: wallet
    password: wallet
  jpa:
    hibernate:
      ddl-auto: none
  sql:
    init:
      mode: always
  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:localhost}
      port: ${SPRING_DATA_REDIS_PORT:6379}
  application:
    name: wallet
  threads:
    virtual:
      enabled: true
  cache:
    cache-names: fraudBlockedUsers
    caffeine:
      spec: maximumSize=10000,expireAfterWrite=5m
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,env,loggers
  endpoint:
    health:
      show-details: always
  tracing:
    propagation:
      type: W3C
    baggage:
      correlation:
        fields:
          - operationId
      remote-fields:
        - operationId
    sampling:
      probability: 1.0
  opentelemetry:
    metrics:
      export:
        otlp:
          endpoint: http://otel-collector:4318/v1/metrics
    tracing:
      sampling:
        probability: 1.0 # Use 1.0 para testes, depois volte para 0.1
      export:
        otlp:
          endpoint: http://otel-collector:4318/v1/traces
    # Novo no SB4: suporte nativo para logs via OTLP
    logging:
      export:
        otlp:
          enabled: true
          endpoint: http://otel-collector:4318/v1/logs

logging:
  opentelemetry:
    enabled: true
  level:
    root: INFO
    br.com.wallet: DEBUG
    org.springframework.web: INFO
    org.springframework: INFO
    org.hibernate: INFO
    io.opentelemetry: INFO
  pattern:
    level: "%5p [traceId=%X{traceId} spanId=%X{spanId} operationId=%X{operationId}]"

nats:
  url: nats://nats:4222
  token: dfji348934jdd0i24uhjd29834ijrr0345jo0r3j034n

redis:
  socket:
    enabled: ${REDIS_SOCKET_ENABLED:false}
    path: ${REDIS_SOCKET_PATH:/var/run/redis/redis.sock}